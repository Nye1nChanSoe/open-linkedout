<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Pagination Full Screen -->
    <div class="jobs-search-pagination jobs-search-results-list__pagination p4">
      <div class="jobs-search-pagination__spacer"></div>

      <ul class="jobs-search-pagination__pages">
        <!----><!---->
        <li class="jobs-search-pagination__indicator">
          <button
            class="jobs-search-pagination__indicator-button jobs-search-pagination__indicator-button--active"
            aria-current="page"
            aria-label="Page 1"
            type="button"
          >
            <span>1</span>
          </button>
        </li>
        <li class="jobs-search-pagination__indicator">
          <button
            class="jobs-search-pagination__indicator-button"
            aria-label="Page 2"
            type="button"
          >
            <span>2</span>
          </button>
        </li>
        <li class="jobs-search-pagination__indicator">
          <button
            class="jobs-search-pagination__indicator-button"
            aria-label="Page 3"
            type="button"
          >
            <span>3</span>
          </button>
        </li>
        <li class="jobs-search-pagination__indicator">
          <button
            class="jobs-search-pagination__indicator-button"
            aria-label="Page 4"
            type="button"
          >
            <span>…</span>
          </button>
        </li>
      </ul>
      <p class="jobs-search-pagination__page-state">Page 1 of 34</p>

      <button
        aria-label="View next page"
        id="ember322"
        class="artdeco-button artdeco-button--muted artdeco-button--icon-right artdeco-button--1 artdeco-button--tertiary ember-view jobs-search-pagination__button jobs-search-pagination__button--next"
        type="button"
      >
        <svg
          role="none"
          aria-hidden="true"
          class="artdeco-button__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          data-supported-dps="16x16"
          data-test-icon="chevron-right-small"
          data-rtl="true"
        >
          <!---->
          <use href="#chevron-right-small" width="16" height="16"></use>
        </svg>

        <span class="artdeco-button__text"> Next </span>
      </button>
    </div>
  </body>
</html>
