<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="flex overflow-hidden contextual-sign-in-modal__layout--stacked">
      <div class="contextual-sign-in-modal__left-content">
        <img
          class="inline-block relative hue-web-entity__image w-8 h-8 contextual-sign-in-modal__img mx-auto lazy-loaded"
          data-ghost-classes="bg-color-entity-ghost-background"
          data-ghost-url="https://static.licdn.com/aero-v1/sc/h/cs8pjfgyw96g44ln9r7tct85f"
          alt=""
          src="https://static.licdn.com/aero-v1/sc/h/7e5r1tyag1womwdkqzon9r2ib"
        />

        <h2
          class="contextual-sign-in-modal__context-screen-title font-sans text-lg text-color-text mt-2 mb-1 text-center"
          id="base-contextual-sign-in-modal-modal-header"
        >
          Sign in to view more jobs
        </h2>
        <!---->
      </div>
      <div class="contextual-sign-in-modal__right-content">
        <div class="contextual-sign-in-modal__google-sign-in-primary w-full">
          <div
            class="google-auth-button"
            data-google-auth-iframe-initialized=""
          >
            <!---->
            <div
              class="google-auth-button__placeholder mx-auto"
              data-theme="filled_blue"
              data-logo-alignment="center"
              data-locale="en_US"
              role="button"
              aria-label="Continue with google"
            >
              <div class="S9gUrf-YoZ4jf" style="position: relative">
                <div></div>
                <iframe
                  src="https://accounts.google.com/gsi/button?logo_alignment=center&amp;shape=pill&amp;size=large&amp;text=continue_with&amp;theme=filled_blue&amp;type=undefined&amp;width=312px&amp;client_id=990339570472-k6nqn1tpmitg8pui82bfaun3jrpmiuhs.apps.googleusercontent.com&amp;iframe_id=gsi_549976_484567&amp;as=xDUb8slTkCfJmGvHdMk3FA&amp;hl=en_US"
                  allow="identity-credentials-get"
                  id="gsi_549976_484567"
                  title="Sign in with Google Button"
                  style="
                    display: block;
                    position: relative;
                    top: 0px;
                    left: 0px;
                    height: 44px;
                    width: 332px;
                    border: 0px;
                    margin: -2px -10px;
                  "
                ></iframe>
              </div>
            </div>
            <!---->
          </div>
        </div>

        <code id="i18n_username_error_empty" style="display: none"
          ><!--"Please enter an email address or phone number"--></code
        >

        <code id="i18n_username_error_too_long" style="display: none"
          ><!--"Email or phone number must be between 3 to 128 characters"--></code
        >
        <code id="i18n_username_error_too_short" style="display: none"
          ><!--"Email or phone number must be between 3 to 128 characters"--></code
        >

        <code id="i18n_password_error_empty" style="display: none"
          ><!--"Please enter a password"--></code
        >

        <code id="i18n_password_error_too_short" style="display: none"
          ><!--"The password you provided must have at least 6 characters"--></code
        >

        <code id="i18n_password_error_too_long" style="display: none"
          ><!--"The password you provided must have at most 400 characters"--></code
        >

        <!---->
        <form
          data-id="sign-in-form"
          action="https://www.linkedin.com/uas/login-submit"
          method="post"
          novalidate=""
          class="contextual-sign-in-modal__sign-in-form mb-1 hidden"
        >
          <input
            name="loginCsrfParam"
            value="b3d88a1d-cdd7-4da5-8160-1d9384568e8a"
            type="hidden"
          />

          <div class="flex flex-col">
            <div class="mt-1.5" data-js-module-id="guest-input">
              <div class="flex flex-col">
                <label class="input-label mb-1" for="csm-v2_session_key">
                  Email or phone
                </label>
                <div class="text-input flex">
                  <input
                    class="text-color-text font-sans text-md outline-0 bg-color-transparent w-full"
                    autocomplete="username"
                    id="csm-v2_session_key"
                    name="session_key"
                    required=""
                    data-tracking-control-name="csm-v2_sign-in-session-key"
                    data-tracking-client-ingraph=""
                    type="text"
                  />
                </div>
              </div>

              <p
                class="input-helper mt-1.5"
                for="csm-v2_session_key"
                role="alert"
                data-js-module-id="guest-input__message"
              ></p>
            </div>

            <div class="mt-1.5" data-js-module-id="guest-input">
              <div class="flex flex-col">
                <label class="input-label mb-1" for="csm-v2_session_password">
                  Password
                </label>
                <div class="text-input flex">
                  <input
                    class="text-color-text font-sans text-md outline-0 bg-color-transparent w-full"
                    autocomplete="current-password"
                    id="csm-v2_session_password"
                    name="session_password"
                    required=""
                    data-tracking-control-name="csm-v2_sign-in-password"
                    data-tracking-client-ingraph=""
                    type="password"
                  />

                  <button
                    aria-live="assertive"
                    aria-relevant="text"
                    data-id="sign-in-form__password-visibility-toggle"
                    class="font-sans text-md font-bold text-color-action z-10 ml-[12px] hover:cursor-pointer"
                    aria-label="Show your LinkedIn password"
                    data-tracking-control-name="csm-v2_sign-in-password-visibility-toggle-btn"
                    type="button"
                  >
                    Show
                  </button>
                </div>
              </div>

              <p
                class="input-helper mt-1.5"
                for="csm-v2_session_password"
                role="alert"
                data-js-module-id="guest-input__message"
              ></p>
            </div>

            <input
              name="session_redirect"
              value="https://www.linkedin.com/jobs/search-results?keywords=Software+Engineer"
              type="hidden"
            />

            <!---->
          </div>

          <div
            data-id="sign-in-form__footer"
            class="flex justify-between sign-in-form__footer--full-width"
          >
            <a
              data-id="sign-in-form__forgot-password"
              class="font-sans text-md font-bold link leading-regular sign-in-form__forgot-password--full-width"
              href="https://www.linkedin.com/uas/request-password-reset?trk=csm-v2_forgot_password"
              data-tracking-control-name="csm-v2_forgot_password"
              data-tracking-will-navigate=""
              >Forgot password?</a
            >

            <!---->
            <input name="trk" value="csm-v2_sign-in-submit" type="hidden" />
            <button
              class="btn-md btn-primary flex-shrink-0 cursor-pointer sign-in-form__submit-btn--full-width"
              data-id="sign-in-form__submit-btn"
              data-tracking-control-name="csm-v2_sign-in-submit-btn"
              data-tracking-client-ingraph=""
              data-tracking-litms=""
              type="submit"
            >
              Sign in
            </button>
          </div>
          <!---->
          <input
            type="hidden"
            name="controlId"
            value="d_jobs_guest_search-csm-v2_sign-in-submit-btn"
          /><input
            type="hidden"
            name="pageInstance"
            value="urn:li:page:d_jobs_guest_search_jsbeacon;v5+cZYAXRwueXKZXZX0lUA=="
          />
        </form>
        <!----><!---->

        <button
          class="contextual-sign-in-modal__sign-in-with-email-cta my-2 btn-sm btn-secondary min-h-[40px] w-full flex align-center justify-center"
          data-tracking-control-name="sign-in-with-email-cta"
        >
          <icon
            class="inline-block align-middle h-[24px] w-[24px] mr-0.5 lazy-loaded"
            aria-hidden="true"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              id="envelope-small"
              data-supported-dps="16x16"
              fill="currentColor"
              focusable="false"
              class="lazy-loaded"
              aria-busy="false"
            >
              <path
                d="M14 3H2a1 1 0 00-1 1v8a1 1 0 001 1h12a1 1 0 001-1V4a1 1 0 00-1-1zm-1 2L8 8.21 3 5h10zM3 11V6.07L7.32 8.8a1.25 1.25 0 001.37 0L13 6.07V11H3z"
              ></path></svg
          ></icon>
          <span class="self-center">Sign in with Email</span>
        </button>

        <div class="contextual-sign-in-modal__divider left-right-divider">
          <p
            class="contextual-sign-in-modal__divider-text font-sans text-sm text-color-text px-2"
          >
            or
          </p>
        </div>

        <div
          class="contextual-sign-in-modal__google-sign-in-secondary contextual-sign-in-modal__google-sign-in-secondary--hidden"
        >
          <div
            class="google-auth-button"
            data-google-auth-iframe-initialized=""
          >
            <!---->
            <div
              class="google-auth-button__placeholder mx-auto google-auth-button__placeholder--black-border"
              data-theme="outline"
              data-logo-alignment="center"
              data-locale="en_US"
              role="button"
              aria-label="Continue with google"
            >
              <div class="S9gUrf-YoZ4jf" style="position: relative">
                <div></div>
                <iframe
                  src="https://accounts.google.com/gsi/button?logo_alignment=center&amp;shape=pill&amp;size=large&amp;text=continue_with&amp;theme=outline&amp;type=undefined&amp;width=312px&amp;client_id=990339570472-k6nqn1tpmitg8pui82bfaun3jrpmiuhs.apps.googleusercontent.com&amp;iframe_id=gsi_549978_901392&amp;as=xDUb8slTkCfJmGvHdMk3FA&amp;hl=en_US"
                  allow="identity-credentials-get"
                  id="gsi_549978_901392"
                  title="Sign in with Google Button"
                  style="
                    display: block;
                    position: relative;
                    top: 0px;
                    left: 0px;
                    height: 44px;
                    width: 332px;
                    border: 0px;
                    margin: -2px -10px;
                  "
                ></iframe>
              </div>
            </div>
            <!---->
          </div>
        </div>

        <p
          class="contextual-sign-in-modal__join-now m-auto font-sans text-md text-center text-color-text my-2"
        >
          New to LinkedIn?
          <a
            href="https://www.linkedin.com/signup/cold-join?source=jobs_registration&amp;trk=public_jobs_contextual-sign-in-modal_join-link"
            data-tracking-control-name="public_jobs_contextual-sign-in-modal_join-link"
            data-tracking-will-navigate="true"
            class="contextual-sign-in-modal__join-link"
            >Join now</a
          >
        </p>

        <p
          class="linkedin-tc__text text-color-text-low-emphasis text-xs pb-2 contextual-sign-in-modal__terms-and-conditions m-auto w-full"
        >
          By clicking Continue to join or sign in, you agree to LinkedIn’s
          <a
            href="/legal/user-agreement?trk=linkedin-tc_auth-button_user-agreement"
            target="_blank"
            data-tracking-control-name="linkedin-tc_auth-button_user-agreement"
            data-tracking-will-navigate="true"
            >User Agreement</a
          >,
          <a
            href="/legal/privacy-policy?trk=linkedin-tc_auth-button_privacy-policy"
            target="_blank"
            data-tracking-control-name="linkedin-tc_auth-button_privacy-policy"
            data-tracking-will-navigate="true"
            >Privacy Policy</a
          >, and
          <a
            href="/legal/cookie-policy?trk=linkedin-tc_auth-button_cookie-policy"
            target="_blank"
            data-tracking-control-name="linkedin-tc_auth-button_cookie-policy"
            data-tracking-will-navigate="true"
            >Cookie Policy</a
          >.
        </p>
      </div>
    </div>
  </body>
</html>
